<!doctype html>
<html lang="{{lang}}" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <link rel="canonical" href="{{canonical}}" />

    {{hreflangLinks}}

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" />

    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/themes/light.css" id="theme" />
  </head>
  <body class="{{bodyClass}}">
    <a class="skip" href="#main">{{skipText}}</a>

    {{header}}

    <main id="main" class="main">{{content}}</main>

    {{footer}}

    <a class="sticky-cta" href="{{joinHref}}">{{joinLabel}}</a>

    <script type="module" src="/assets/js/site.js"></script>
  </body>
</html>
