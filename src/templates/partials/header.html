<header class="header">
  <div class="container header__inner">
    <a class="brand" href="{{brandHref}}">
      <span class="brand__mark" aria-hidden="true">BSC</span>
      <span class="brand__text">
        <span class="brand__name">BSC 70 Linz</span>
        <span class="brand__tag">Badminton Sport Club</span>
      </span>
    </a>

    <nav class="nav" aria-label="Navigation">
      <button class="nav__toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-nav-toggle>
        {{menuLabel}}
      </button>
      <div class="nav__panel" id="site-nav" data-nav-panel hidden>
        {{nav}}
        {{mobileCta}}
        <div class="nav__right">
          {{cta}}
          <button class="theme-toggle" type="button" data-theme-toggle>Theme</button>
          {{langSwitch}}
        </div>
      </div>
    </nav>
  </div>
</header>
