<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BSC 70 Linz — Badminton Sport Club</title>
    <meta name="description" content="ASKÖ BSC 70 Linz — Einer der erfolgreichsten Badmintonvereine Österreichs seit 1970. Training, Mannschaften, Mitgliedschaft." />
    <meta name="robots" content="index, follow" />

    <!--
      No hostname is hardcoded in this file. The site is served on several
      domains that do not redirect to one another, so canonical and og:url are
      set at runtime from the origin the page was actually loaded from
      (src/lib/seo.ts). A static canonical here would point every domain at
      one host; an absent one lets a crawler treat the requested URL as
      canonical, which is the correct fallback.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BSC 70 Linz" />
    <meta property="og:title" content="BSC 70 Linz — Badminton Sport Club" />
    <meta property="og:description" content="ASKÖ BSC 70 Linz — Einer der erfolgreichsten Badmintonvereine Österreichs seit 1970. Training, Mannschaften, Mitgliedschaft." />
    <meta property="og:image" content="/assets/hero-bg.jpg" />
    <meta property="og:locale" content="de_AT" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BSC 70 Linz — Badminton Sport Club" />
    <meta name="twitter:description" content="ASKÖ BSC 70 Linz — Einer der erfolgreichsten Badmintonvereine Österreichs seit 1970. Training, Mannschaften, Mitgliedschaft." />
    <meta name="twitter:image" content="/assets/hero-bg.jpg" />

    <meta name="google-site-verification" content="rwwLnGuO83QCkQ6Y8_O_Jo--LUypj4ZefF45C6onk4g" />
    <meta name="google-site-verification" content="w_K3UWGeWZDqN1kwFMwDO-rVVfGWQxFeFJiDOHIrDBE" />

    <link rel="icon" type="image/png" href="/favicon-dark.png" />
    <!-- Inter and Bebas Neue are bundled and served from our own domain; see
         the @fontsource imports in src/main.tsx. There is deliberately no
         webfont CDN link here, so loading a page cannot disclose a visitor's
         IP address to a third party. -->
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
