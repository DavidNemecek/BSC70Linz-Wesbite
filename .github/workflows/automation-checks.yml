name: Automation checks
on:
  push:
  pull_request:
  workflow_dispatch:

# Candidate code runs here without secrets or a write-capable token. The security
# update controller uses its separate worker for authenticated candidate validation.
permissions:
  contents: read

jobs:
  automation:
    name: Automation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Test trusted automation policy and adapters
        run: node --test .github/automation/*.test.mjs
      - name: Install independent QA support dependencies
        run: npm ci --prefix .github/qa --ignore-scripts --no-fund --no-audit
      - name: Test independent QA support
        run: node --test .github/qa/support.test.mjs
      - name: Prove dependency isolation with a hostile fixture
        run: |
          docker pull docker.io/library/ubuntu@sha256:a2d43bffc46670d7108bb3c0468c67c5557c4c92e83e1e34cbff1322ad1b94dc
          node .github/automation/sandbox-integration.mjs

  application:
    name: Application lint, build and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Audit all dependencies
        run: npm audit --audit-level=low --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low --ignore-scripts
