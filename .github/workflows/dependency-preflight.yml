name: Dependency integration preflight
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - .github/automation/ai.mjs
      - .github/automation/prompts.mjs
      - .github/automation/preflight.mjs
      - .github/automation/vercel.mjs
      - .github/automation/maintenance.mjs
      - .github/automation/toolchain-security.mjs
      - .github/automation/toolchain.mjs
      - .github/automation/controller.mjs
      - .github/automation/controller.test.mjs
      - .github/workflows/dependency-preflight.yml
      - .nvmrc
      - package.json
      - package-lock.json
      - .github/workflows/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # This workflow is loaded from the trusted base branch. Keep the
      # secret-bearing code checkout separate from the PR tree: candidate files
      # are data only and are never imported or executed with credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: trusted/.nvmrc
          package-manager-cache: false
      - name: Test automation policies
        working-directory: trusted
        run: node --test .github/automation/*.test.mjs
      - name: Verify scoped Vercel access and real AI search
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: gpt-6.1-sol
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        working-directory: trusted
        run: node .github/automation/preflight.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-integration-preflight
          path: trusted/evidence/
          if-no-files-found: warn
          retention-days: 30
