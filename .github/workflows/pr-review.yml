name: Independent PR review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  # GITHUB_TOKEN-created PRs do not automatically trigger pull_request_target.
  # The trusted controller explicitly dispatches this lane and awaits its exact
  # PR/base ref/base/head review record plus CI; maintainers can dispatch it too.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number to review (candidate is read via the API only)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: independent-pr-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review:
    # Trust only the installed default-branch workflow. For first installation,
    # merge the reviewed automation into main; feature-ref dispatch is not a bypass.
    if: >-
      github.event.repository.default_branch == 'main' &&
      github.workflow_ref == format('{0}/.github/workflows/pr-review.yml@refs/heads/main', github.repository) &&
      (github.event_name != 'pull_request_target' || github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout trusted main automation only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up trusted Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # No install, candidate checkout, shell interpolation of PR fields, tools,
      # repository scripts, write access to contents, or auto-merge API here.
      - name: Independently review bounded candidate data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: gpt-6.1-sol
        run: node .github/automation/pr-review.mjs
