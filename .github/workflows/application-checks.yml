name: Trusted application checks
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact open PR number (ordinary bot updates and restores)
        type: string
        required: true
      head_sha:
        description: Exact immutable PR head SHA
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: application-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize application identities on trusted main
    if: >-
      github.event.repository.default_branch == 'main' &&
      github.workflow_ref == format('{0}/.github/workflows/application-checks.yml@refs/heads/main', github.repository) &&
      (github.event_name != 'pull_request_target' || github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: write
    outputs:
      proof: ${{ steps.authorize.outputs.proof }}
      check_id: ${{ steps.authorize.outputs.check_id }}
      head_sha: ${{ steps.authorize.outputs.head_sha }}
      head_repository: ${{ steps.authorize.outputs.head_repository }}
      trusted_sha: ${{ steps.authorize.outputs.trusted_sha }}
    steps:
      - name: Checkout exact trusted workflow revision only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up trusted Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Authorize exact PR and actual serving production without candidate execution
        id: authorize
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node .github/automation/recovery-checks.mjs authorize

  validate:
    name: Isolated application validation
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout exact trusted harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.trusted_sha }}
          path: trusted
          persist-credentials: false
      - name: Set up trusted Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: trusted/.nvmrc
          package-manager-cache: false
      - name: Checkout authorized candidate as data without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.authorize.outputs.head_repository }}
          ref: ${{ needs.authorize.outputs.head_sha }}
          path: candidate
          persist-credentials: false
      - name: Pull reviewed immutable container base
        run: docker pull docker.io/library/ubuntu@sha256:a2d43bffc46670d7108bb3c0468c67c5557c4c92e83e1e34cbff1322ad1b94dc
      - name: Audit read-only before plugins, then install, tree, lint, build and source integrity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLICATION_PROOF: ${{ needs.authorize.outputs.proof }}
        run: node trusted/.github/automation/recovery-checks.mjs validate
      - name: Record complete audits and host validation envelope
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

  finalize:
    name: Reauthorize production and publish exact head check
    needs: [authorize, validate]
    if: always() && needs.authorize.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - name: Checkout exact trusted authorizer only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.trusted_sha }}
          persist-credentials: false
      - name: Set up trusted Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # The build job's trusted host process alone decides success. This job
      # neither downloads/executes candidate artifacts nor accepts their verdicts.
      # Re-read production with a fresh token after container teardown.
      - name: Recheck current main, PR, tree and actual Vercel production; complete the same check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          APPLICATION_PROOF: ${{ needs.authorize.outputs.proof }}
          APPLICATION_CHECK_ID: ${{ needs.authorize.outputs.check_id }}
          APPLICATION_BUILD_RESULT: ${{ needs.validate.result }}
        run: node .github/automation/recovery-checks.mjs finalize
